<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>North Studio</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f4ec;color:#202b24;font-family:Georgia,serif}header{display:flex;justify-content:space-between;align-items:center;padding:28px 7%;font-family:Arial,sans-serif}header strong{font-size:21px;letter-spacing:-1px}nav{display:flex;gap:24px;font-size:13px}.hero{min-height:570px;padding:90px 8%;display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:60px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#75836d}h1{font-size:clamp(45px,6vw,82px);line-height:1.03;letter-spacing:-.045em;margin:20px 0}p{font:16px/1.7 Arial,sans-serif;max-width:460px;color:#59665d}.button{display:inline-block;background:#354f3f;color:white;padding:22px 36px;border-radius:4px;text-decoration:none;font:16px Arial,sans-serif;margin-top:20px}.shape{aspect-ratio:1;background:#d7e0cb;border-radius:48% 48% 3px 3px;display:grid;place-items:center;position:relative;overflow:hidden}.shape:before{content:'';width:48%;height:70%;background:#b2c1a4;border-radius:50% 50% 6px 6px;transform:rotate(-14deg)}.shape:after{content:'NORTH / STUDIO';position:absolute;bottom:24px;right:24px;font:10px Arial,sans-serif;letter-spacing:.18em}.footer{padding:30px 8%;border-top:1px solid #dfe3db;font:12px Arial,sans-serif;color:#718076}@media(max-width:650px){nav{display:none}.hero{grid-template-columns:1fr;padding-top:40px}.shape{max-width:400px}h1{font-size:48px}}
  </style>
</head>
<body>
  <header><strong>north / studio</strong><nav><span>Our work</span><span>Services</span><span>Contact</span></nav></header>
  <main class="hero"><div><div class="eyebrow">Independent creative studio</div><h1>Thoughtful spaces for better living.</h1><p>We make considered spaces and identities for people who care about the details.</p><a class="button" href="#contact">Book a call</a></div><div class="shape" aria-label="Abstract green arch"></div></main>
  <footer class="footer" id="contact">North Studio · A sample website for your review session</footer>
</body>
</html>
